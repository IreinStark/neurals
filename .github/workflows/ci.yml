name: CI

# Manual-only for now: the GitHub account's Actions billing is locked, so automatic
# runs fail before starting. Run from the Actions tab ("Run workflow"), or restore the
# push / pull_request triggers below once billing is sorted.
on:
  workflow_dispatch:
  # push:
  #   branches: [main, "gp2/**"]
  # pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (Next.js) — lint, typecheck, unit, build, e2e
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: starrynight/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: starrynight/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Install sync server (used by the E2E tests)
        working-directory: starrynight/party
        run: npm ci && npm run typecheck && npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E smoke + axe-core
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-reports
          path: |
            starrynight/web/coverage/
            starrynight/web/playwright-report/
          if-no-files-found: ignore

  backend:
    name: Backend (Django) — tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: starrynight/backend
    env:
      CACHE_BACKEND: locmem
      WEBCAM_VIDEO_TASK_MODE: thread
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: starrynight/requirements.txt
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r ../requirements.txt
      - run: python manage.py check
      - run: python manage.py test api_v2 style_transfer.tests -v 2

  database:
    name: Database (Supabase migrations) — RLS tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run RLS tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: starrynight/supabase/scripts/test-db.sh
